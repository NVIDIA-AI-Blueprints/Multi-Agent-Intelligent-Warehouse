[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maiw-api"
version = "0.1.0"
description = "MAIW FastAPI application — the API layer that wires all packages together"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    # MAIW packages
    "maiw-models>=0.1.0",
    "maiw-skills>=0.1.0",
    "maiw-state>=0.1.0",
    "maiw-decision>=0.1.0",
    "maiw-mcp>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maiw_api*"]
