name: state_drift
display_name: "State Drift"
description: >
  Inventory counts have drifted from what the WMS shows — three SKUs
  are below reorder point but have not triggered replenishment.  Two
  equipment assets have undeclared status mismatches.  Demonstrates the
  AI's ability to detect and surface state drift without taking automated
  action on unverified data.
tags: [drift, inventory, equipment, demo]
rng_seed: 42
clock_offset_seconds: 3600  # 1 hour into shift

initial_state:
  inventory:
    - sku: "SKU-1001"
      name: "Lay's Classic Chips 1.5oz"
      zone: "A1"
      location_id: "A-01-01"
      quantity_available: 480       # Below reorder_point=500 — drift
      quantity_reserved: 120
      reorder_point: 500

    - sku: "SKU-1002"
      name: "Doritos Nacho Cheese 1.75oz"
      zone: "A1"
      location_id: "A-01-02"
      quantity_available: 380       # Below reorder_point=400 — drift
      quantity_reserved: 200
      reorder_point: 400

    - sku: "SKU-1003"
      name: "Cheetos Crunchy 2oz"
      zone: "A2"
      location_id: "A-02-01"
      quantity_available: 290       # Below reorder_point=300 — drift
      quantity_reserved: 50
      reorder_point: 300

    - sku: "SKU-1004"
      name: "Ruffles Original 2.5oz"
      zone: "A2"
      location_id: "A-02-02"
      quantity_available: 1100      # Healthy
      quantity_reserved: 80
      reorder_point: 250

    - sku: "SKU-2001"
      name: "Gatorade Blue 32oz"
      zone: "B1"
      location_id: "B-01-01"
      quantity_available: 3000      # Healthy
      quantity_reserved: 400
      reorder_point: 600

  equipment:
    - asset_id: "AGV-01"
      equipment_type: "agv"
      model: "Locus Origin"
      zone: "A1"
      status: "available"           # WMS says assigned — drift
      battery_pct: 65.0

    - asset_id: "AGV-02"
      equipment_type: "agv"
      model: "Locus Origin"
      zone: "A2"
      status: "charging"            # WMS says available — drift
      battery_pct: 23.0             # Actually needs charging

    - asset_id: "AMR-01"
      equipment_type: "amr"
      model: "Boston Dynamics Spot"
      zone: "B1"
      status: "available"
      battery_pct: 78.0

    - asset_id: "FKL-01"
      equipment_type: "forklift"
      model: "Toyota 8FBE15"
      zone: "C1"
      status: "available"
      battery_pct: 100.0

    - asset_id: "SCN-01"
      equipment_type: "scanner"
      model: "Zebra TC52"
      zone: "A1"
      status: "available"
      battery_pct: 45.0

  workers:
    - worker_id: "w-001"
      username: "alice"
      full_name: "Alice Chen"
      role: "operator"
      status: "active"
      zone: "A1"

    - worker_id: "w-002"
      username: "bob"
      full_name: "Bob Smith"
      role: "operator"
      status: "active"
      zone: "A1"

    - worker_id: "w-003"
      username: "carol"
      full_name: "Carol Liu"
      role: "supervisor"
      status: "active"
      zone: "A2"

    - worker_id: "w-004"
      username: "david"
      full_name: "David Park"
      role: "operator"
      status: "active"
      zone: "B1"

  tasks:
    - task_id: "task-001"
      task_type: "PICK"
      zone: "A1"
      status: "in_progress"
      assigned_to: "w-001"
      priority: "high"

    - task_id: "task-002"
      task_type: "CYCLE_COUNT"
      zone: "A1"
      status: "pending"
      priority: "medium"

    - task_id: "task-003"
      task_type: "PICK"
      zone: "A2"
      status: "pending"
      priority: "high"

timed_events: []
