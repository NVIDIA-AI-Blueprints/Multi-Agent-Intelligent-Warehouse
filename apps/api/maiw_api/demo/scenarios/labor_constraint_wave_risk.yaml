    - worker_id: "w-005"
      username: "eva"
      full_name: "Eva Rodriguez"
      role: "operator"
      status: "active"
      zone: "A2"
      current_task_id: "task-002"

    - worker_id: "w-006"
      username: "frank"
      full_name: "Frank Osei"
      role: "manager"
      status: "active"
      zone: "C1"

  tasks:
    - task_id: "task-001"
      task_type: "PICK"
      zone: "A1"
      status: "in_progress"
      assigned_to: "w-001"
      priority: "high"
      deadline: "2026-08-23T09:30:00+00:00"

    - task_id: "task-002"
