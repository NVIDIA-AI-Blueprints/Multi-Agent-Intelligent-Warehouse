    - worker_id: "w-002"
      username: "bob"
      full_name: "Bob Smith"
      role: "operator"
      status: "on_leave"    # Absent
      zone: "A1"

    - worker_id: "w-003"
      username: "carol"
      full_name: "Carol Liu"
