name: labor_constraint_wave_risk
display_name: "Labor Constraint + Wave Risk"
description: >
  Two operators are absent (on_leave).  A high-priority pick wave has seven
  pending tasks with no assigned workers and a carrier cutoff in 45 minutes.
  OTIF risk is high.  The operations agent must detect the constraint,
  reallocate available workers, and reprioritize the wave.
tags: [labor, wave, otif, risk, demo]
rng_seed: 42
clock_offset_seconds: 5400  # 90 min into shift

