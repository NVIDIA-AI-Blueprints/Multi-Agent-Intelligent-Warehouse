  inventory:
    - sku: "SKU-1001"
      name: "Lay's Classic Chips 1.5oz"
      zone: "A1"
      location_id: "A-01-01"
      quantity_available: 2400
      quantity_reserved: 120
      reorder_point: 500

    - sku: "SKU-1002"
      name: "Doritos Nacho Cheese 1.75oz"
      zone: "A1"
      location_id: "A-01-02"
      quantity_available: 1800
      quantity_reserved: 200
      reorder_point: 400

    - sku: "SKU-1003"
      name: "Cheetos Crunchy 2oz"
      zone: "A2"
      location_id: "A-02-01"
      quantity_available: 950
      quantity_reserved: 50
      reorder_point: 300

  equipment:
    - asset_id: "AGV-01"
      equipment_type: "agv"
      model: "Locus Origin"
      zone: "A1"
      status: "available"
