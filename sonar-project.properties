# ======================================================
# SonarQube analysis: NVIDIA SonarQube (sonar.nvidia.com)
# ======================================================
# nSpect NSPECT-NJMX-9GQU (MAIW-Core) is associated with this project.
# The workflow (.github/workflows/sonarqube.yml) and scripts/security/
# run_sonar_scan.sh pass the host, token, version, revision and branch or
# pull-request parameters; this file holds the analysis scope only.
# Source coverage map: docs/security/architecture-security-inventory.md.

sonar.projectKey=TEGRASW_Blueprints-SRE_warehouse-operational-assistant_Multi-Agent-Intelligent-Warehouse
sonar.links.scm=https://github.com/NVIDIA-AI-Blueprints/Multi-Agent-Intelligent-Warehouse
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------
# Production code
# ------------------------------------------------------
# src/           legacy API routers, adapters, retrieval, web UI (src/ui/web)
# apps/          canonical API (maiw_api), the only release entrypoint
# packages/      maiw-* packages: agents, decision, execution, MCP, models,
#                state, skills, contracts, world
# mcp_servers/   the four MCP domain servers
# integrations/  NemoClaw / OpenShell integration
# scripts/       setup, deployment and operations tooling
# Dockerfiles    the images built for Compose and the release
sonar.sources=src,apps,packages,mcp_servers,integrations,scripts,Dockerfile,Dockerfile.backend,Dockerfile.frontend,Dockerfile.mcp,Dockerfile.rapids

# ------------------------------------------------------
# Test code
# ------------------------------------------------------
# Tests live in tests/ and next to the code (packages/*/tests, apps/api/tests,
# src/adapters/*/tests, src/ui/web/src/__tests__). Files matching these
# patterns are analyzed as tests and are excluded from the sources above.
sonar.tests=tests,src,apps,packages
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/setupTests.ts

# Generated, vendored and build output only, plus the test files above. No
# first-party source directory is excluded.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/*.min.js,**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/setupTests.ts

# ------------------------------------------------------
# Languages
# ------------------------------------------------------
# CI runs Python 3.11; the backend image runs 3.13.
sonar.python.version=3.11,3.13

# ------------------------------------------------------
# Coverage
# ------------------------------------------------------
# coverage.xml comes from the CI/CD Pipeline's CORE pytest run
# (--cov=src --cov=apps --cov=packages, relative paths: see
# [tool.coverage.run] in pyproject.toml). UI (Jest) coverage is disabled in
# CI, so no lcov report exists yet and the UI shows as uncovered.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=src/ui/web/coverage/lcov.info

# Operational scripts and Dockerfiles have no unit-test coverage by design.
sonar.coverage.exclusions=scripts/**,Dockerfile*,**/__init__.py
