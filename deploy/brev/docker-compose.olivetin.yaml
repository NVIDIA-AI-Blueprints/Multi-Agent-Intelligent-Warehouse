name: maiw-brev-olivetin

services:
  olivetin:
    image: ghcr.io/olivetin/olivetin:latest
    container_name: maiw-brev-olivetin
    user: "0:0"
    restart: unless-stopped
    ports:
      - "9090:1337"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1337/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ../..:/maiw
      - ./generated/docker-config:/root/.docker
      - /ephemeral:/ephemeral
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
