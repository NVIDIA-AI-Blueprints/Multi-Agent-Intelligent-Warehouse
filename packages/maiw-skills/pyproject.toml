[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maiw-skills"
version = "0.1.0"
description = "Per-domain skill implementations for MAIW warehouse agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "maiw-mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maiw_skills*"]
