# Builds the Multi-Agent Intelligent Warehouse Demo Mode containers, waits for
# the API and the UI to answer, then runs the UI E2E test suite from the shared
# QA image.
#
# Required repository secrets:
#   NVIDIA_API_KEY         NVIDIA API key for hosted inference (agent analysis
#                          and Copilot).
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to
#                          nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image.
#                          If unset, the test step is skipped.
#
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-agent-intelligent-warehouse-ui:
    name: Multi-Agent Intelligent Warehouse UI E2E
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      API_URL: http://127.0.0.1:8001
      UI_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Demo Mode containers
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          docker build -f Dockerfile.backend -t maiw-backend .
          docker build -f Dockerfile.frontend -t maiw-frontend .
          docker network create maiw-demo 2>/dev/null || true
          docker run -d --name maiw-backend --network maiw-demo -p 127.0.0.1:8001:8001 \
            -e NVIDIA_API_KEY \
            -e MAIW_DEPLOYMENT_PROFILE=demo -e MAIW_DEMO_MODE=true \
            -e MAIW_SANDBOX_MODE=disabled -e MAIW_PERSISTENCE_MODE=memory \
            maiw-backend
          docker run -d --name maiw-frontend --network maiw-demo -p 127.0.0.1:3001:8080 \
            -e MAIW_API_UPSTREAM=http://maiw-backend:8001 \
            maiw-frontend

          echo "Waiting for the API (READY, demo profile) and the UI to answer (up to 10 min)..."
          if ! timeout 600 bash -c 'until curl -s "${API_URL}/api/v1/ready" | python3 -c "import json,sys; b=json.load(sys.stdin); sys.exit(0 if b.get(\"status\") == \"READY\" and b.get(\"profile\") == \"demo\" else 1)" > /dev/null 2>&1 && curl -fsS -o /dev/null "${UI_URL}/"; do sleep 10; done'; then
            echo "::error::The API did not report READY with the demo profile, or the UI did not answer, within 10 minutes."
            docker ps -a
            curl -s "${API_URL}/api/v1/ready" || true
            exit 1
          fi
          curl -s "${API_URL}/api/v1/ready"
          echo
          echo "API and UI are ready."

      - name: Run UI automation tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || exit 0
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"
          docker run --rm --net=host -v "$(pwd):/workspace" "${QA_TEST_IMAGE}" \
            pytest -m maiw \
              --maiw-playground-url="${UI_URL}" \
              --reruns=2 --reruns-delay=15 \
              --disable-warnings -v --timeout=240 \
              --html=/workspace/maiw-ui-test.html --self-contained-html

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker ps -a > ci-diagnostics/docker-ps.txt 2>&1 || true
          docker logs --timestamps --tail 300 maiw-backend > ci-diagnostics/maiw-backend.txt 2>&1 || true
          docker logs --timestamps --tail 300 maiw-frontend > ci-diagnostics/maiw-frontend.txt 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maiw-ui-test
          path: |
            maiw-ui-test.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rm -f maiw-frontend maiw-backend 2>/dev/null || true
          docker network rm maiw-demo 2>/dev/null || true
          docker rmi maiw-backend maiw-frontend "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}${SMTP_PASSWORD:-}${SMTP_MAIL_TO:-}${SMTP_MAIL_FROM:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
