name: Multi-Agent-Intelligent-Warehouse deployment test

# This workflow strictly follows the 13-step deployment procedure from DEPLOYMENT.md:
# 1. Clone repository
# 2. Verify Node.js version (check_node_version.sh)
# 3. Setup environment (setup_environment.sh)
# 4. Configure environment variables (.env in deploy/compose/)
# 5. Start infrastructure services (dev_up.sh)
# 6. Wait for wosa-llm-nim (GET /v1/health/ready on :8000, up to 20 min, every 2 min)
# 7. Run database migrations (5 SQL files via Docker Compose)
# 8. Create default users (create_default_users.py)
# 9. Generate demo data (quick_demo_data.py)
# 10. Generate historical demand data (generate_historical_demand.py)
# 11. (Optional) Install RAPIDS GPU acceleration (install_rapids.sh)
# 12. Start API server (start_server.sh)
# 13. Start frontend (npm install + npm start)
#
# Post-deployment verification:
# - Health checks: /health, /api/v1/health, /api/v1/health/simple
# - Access points: Frontend (3001), API (8001), Docs, Metrics
# - Integration tests
# - MAIW UI tests: pytest -m maiw (blueprint-github-test image, --maiw-playground-url)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full Stack Deployment - Following DEPLOYMENT.md 13-Step Procedure
  deploy-and-test:
    #runs-on: ubuntu-latest
    runs-on: arc-runners-org-nvidia-ai-bp-4-gpu

    steps:
      # Step 1: Clone repository
      - name: "Step 1: Clone repository"
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Node.js 20.x LTS per DEPLOYMENT.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      # Step 2: Verify Node.js version (recommended before setup)
      - name: "Step 2: Verify Node.js version"
        run: |
          echo "Running check_node_version.sh..."
          chmod +x ./scripts/setup/check_node_version.sh
          ./scripts/setup/check_node_version.sh

      # Step 3: Setup environment
      - name: "Step 3: Setup environment"
        run: |
          echo "Running setup_environment.sh..."
          chmod +x ./scripts/setup/setup_environment.sh
          ./scripts/setup/setup_environment.sh || echo "⚠️ Environment setup script completed"

          # Ensure venv exists (script may create it)
          if [ ! -d "env" ]; then
            echo "Creating virtual environment..."
            python -m venv env
          fi

          # Install dependencies
          source env/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Configure environment variables (REQUIRED before starting services)
      - name: "Step 4: Configure environment variables"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "Creating .env file for Docker Compose (recommended location)..."
          cp .env.example deploy/compose/.env

          # Edit with test values
          echo "NVIDIA_API_KEY=${NVIDIA_API_KEY}" >> deploy/compose/.env
          echo "LLM_NIM_URL=https://integrate.api.nvidia.com/v1" >> deploy/compose/.env

          echo "✅ .env file configured at deploy/compose/.env"

          # scripts/setup/dev_up.sh sources and edits .env in the repository root (cwd), not deploy/compose/.env
          cp deploy/compose/.env .env
          echo "✅ Root .env synced for dev_up.sh"

      # Prerequisite: Authenticate Docker to NGC registry for private NIM image pulls
      - name: "Authenticate Docker to nvcr.io"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo "❌ Missing required secret: NVIDIA_API_KEY"
            echo "   Set NVIDIA_API_KEY to an NGC registry API key with Catalog/registry access."
            exit 1
          fi

          echo "Logging into nvcr.io..."
          echo "${NVIDIA_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          echo "✅ Docker authenticated to nvcr.io"

      # Inject NGC_API_KEY for llm-nim (CI only; keeps deploy/compose/docker-compose.dev.yaml unchanged in repo)
      - name: "Patch docker-compose.dev.yaml (llm-nim NGC_API_KEY)"
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("deploy/compose/docker-compose.dev.yaml")
          text = path.read_text().replace("\r\n", "\n")
          # Avoid $ in workflow YAML (heredoc may leave $$ literal); build compose ${...} with chr(36)
          d = chr(36)
          marker = "      - NVIDIA_API_KEY=" + d + "{NVIDIA_API_KEY:-}\n"
          ngc = "      - NGC_API_KEY=" + d + "{NVIDIA_API_KEY:-}\n"
          if "NGC_API_KEY" in text:
              print("NGC_API_KEY already present; skipping patch")
          elif marker not in text:
              raise SystemExit("patch anchor not found: expected llm-nim line " + repr(marker.strip()))
          else:
              path.write_text(text.replace(marker, marker + ngc, 1))
              print("Patched llm-nim: inserted NGC_API_KEY after NVIDIA_API_KEY")
          PY

      # Step 5: Start infrastructure services
      - name: "Step 5: Start infrastructure services"
        run: |
          echo "Running dev_up.sh..."
          chmod +x ./scripts/setup/dev_up.sh
          ./scripts/setup/dev_up.sh

          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 120
          echo "Docker containers (docker ps --all):"
          docker ps --all
          echo "Docker logs (wosa-backend):"
          docker logs wosa-backend
          echo "✅ Infrastructure services started"

      # Step 6: Ensure wosa-llm-nim (LLM NIM) is ready
      - name: "Step 6: Wait for wosa-llm-nim ready"
        run: |
          set -e
          NIM_HEALTH_URL="http://127.0.0.1:8000/v1/health/ready"
          INTERVAL_SEC=120
          TIMEOUT_SEC=1200

          echo "Checking wosa-llm-nim container..."
          docker ps --all --filter "name=wosa-llm-nim" || true

          echo "Polling ${NIM_HEALTH_URL} every ${INTERVAL_SEC}s (2 min), total timeout ${TIMEOUT_SEC}s (20 min)"
          start_ts=$(date +%s)
          attempt=1
          while true; do
            echo ""
            echo "--- Attempt ${attempt} at $(date -u +"%Y-%m-%dT%H:%M:%SZ") ---"
            http_code=$(curl -sS -o /tmp/wosa_nim_health.txt -w "%{http_code}" "$NIM_HEALTH_URL" || echo "000")
            echo "Response body:"
            cat /tmp/wosa_nim_health.txt
            echo ""
            echo "HTTP status code: ${http_code}"

            if [ "$http_code" = "200" ]; then
              echo "✅ wosa-llm-nim is ready (/v1/health/ready returned 200)"
              exit 0
            fi

            now_ts=$(date +%s)
            elapsed=$((now_ts - start_ts))
            if [ "$elapsed" -ge "$TIMEOUT_SEC" ]; then
              echo "❌ Timeout: wosa-llm-nim did not become ready within ${TIMEOUT_SEC}s (20 min)"
              echo ""
              echo "Docker logs (wosa-llm-nim, last 2000 lines):"
              docker logs --tail 2000 wosa-llm-nim 2>&1 || echo "(could not read logs: container missing or stopped)"
              exit 1
            fi

            remaining=$((TIMEOUT_SEC - elapsed))
            sleep_sec=$INTERVAL_SEC
            if [ "$remaining" -lt "$sleep_sec" ]; then
              sleep_sec=$remaining
            fi
            echo "Not ready yet. Sleeping ${sleep_sec}s before next check (${elapsed}s elapsed, ${remaining}s remaining until timeout)..."
            sleep "$sleep_sec"
            attempt=$((attempt + 1))
          done

      # Step 7: Run database migrations
      - name: "Step 7: Run database migrations"
        run: |
          source env/bin/activate

          # Load environment variables from .env file (REQUIRED before running migrations)
          set -a && source deploy/compose/.env && set +a

          echo "Running database migrations (Docker Compose method)..."

          # Migration 1/5
          echo "Running 000_schema.sql..."
          docker compose -f deploy/compose/docker-compose.dev.yaml exec -T timescaledb psql -U warehouse -d warehouse < data/postgres/000_schema.sql

          # Migration 2/5
          echo "Running 001_equipment_schema.sql..."
          docker compose -f deploy/compose/docker-compose.dev.yaml exec -T timescaledb psql -U warehouse -d warehouse < data/postgres/001_equipment_schema.sql

          # Migration 3/5
          echo "Running 002_document_schema.sql..."
          docker compose -f deploy/compose/docker-compose.dev.yaml exec -T timescaledb psql -U warehouse -d warehouse < data/postgres/002_document_schema.sql

          # Migration 4/5
          echo "Running 004_inventory_movements_schema.sql..."
          docker compose -f deploy/compose/docker-compose.dev.yaml exec -T timescaledb psql -U warehouse -d warehouse < data/postgres/004_inventory_movements_schema.sql

          # Migration 5/5
          echo "Running create_model_tracking_tables.sql..."
          docker compose -f deploy/compose/docker-compose.dev.yaml exec -T timescaledb psql -U warehouse -d warehouse < scripts/setup/create_model_tracking_tables.sql

          echo "✅ All 5 migrations completed"

      # Step 8: Create default users
      - name: "Step 8: Create default users"
        run: |
          source env/bin/activate
          set -a && source deploy/compose/.env && set +a

          echo "Running create_default_users.py..."
          python scripts/setup/create_default_users.py
          echo "✅ Default users created"

      # Step 9: Generate demo data (optional but recommended)
      - name: "Step 9: Generate demo data"
        run: |
          source env/bin/activate
          set -a && source deploy/compose/.env && set +a

          echo "Running quick_demo_data.py..."
          python scripts/data/quick_demo_data.py
          echo "✅ Demo data generated"

      # Step 10: Generate historical demand data for forecasting (optional, required for Forecasting page)
      - name: "Step 10: Generate historical demand data"
        run: |
          source env/bin/activate
          set -a && source deploy/compose/.env && set +a

          echo "Running generate_historical_demand.py..."
          python scripts/data/generate_historical_demand.py || echo "⚠️ Historical demand generation failed (non-blocking)"
          echo "✅ Historical demand data generated"

      # Step 11: (Optional) Install RAPIDS GPU acceleration
      - name: "Step 11: (Optional) Install RAPIDS GPU acceleration"
        run: |
          source env/bin/activate

          echo "Installing RAPIDS GPU acceleration..."
          chmod +x ./scripts/setup/install_rapids.sh
          ./scripts/setup/install_rapids.sh || echo "⚠️ RAPIDS installation failed (will use CPU fallback)"

          echo "✅ RAPIDS GPU acceleration setup completed"

      # Step 12: Start API server
      - name: "Step 12: Start API server"
        run: |
          source env/bin/activate
          set -a && source deploy/compose/.env && set +a

          echo "Running start_server.sh in background..."
          chmod +x ./scripts/start_server.sh
          ./scripts/start_server.sh &

          # Wait for server to start
          echo "Waiting for API server to start..."
          sleep 20
          echo "✅ API server started"

      # Step 13: Start frontend
      - name: "Step 13: Start frontend"
        run: |
          echo "Starting frontend..."
          cd src/ui/web

          # Fix EACCES when node_modules was created by root / a prior job
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" . || true
          fi
          rm -rf node_modules
          npm cache clean --force

          echo "Running npm ci (deterministic install from lockfile)..."
          npm ci

          echo "Starting frontend dev server in background..."
          npm start &

          # Wait for frontend to start
          echo "Waiting for frontend to start..."
          sleep 15

          echo "✅ Frontend started"

      # Post-Deployment: Verify health checks and access points
      - name: "Verify: API health checks"
        run: |
          # Wait for API to be fully ready
          max_retries=30
          retry_count=0

          echo "Waiting for API server to be ready..."
          until curl -f http://localhost:8001/health &>/dev/null || [ $retry_count -eq $max_retries ]; do
            echo "Attempt $((retry_count + 1))/$max_retries: API not ready yet..."
            sleep 2
            retry_count=$((retry_count + 1))
          done

          if [ $retry_count -eq $max_retries ]; then
            echo "❌ API failed to start after $max_retries attempts"
            exit 1
          fi

          echo "✅ API is ready!"

          # Test all health check endpoints (per DEPLOYMENT.md)
          echo "Testing /health endpoint..."
          curl -f http://localhost:8001/health || (echo "❌ /health failed" && exit 1)

          echo "Testing /api/v1/health endpoint..."
          curl -f http://localhost:8001/api/v1/health || (echo "❌ /api/v1/health failed" && exit 1)

          echo "Testing /api/v1/health/simple endpoint..."
          curl -f http://localhost:8001/api/v1/health/simple || (echo "❌ /api/v1/health/simple failed" && exit 1)

          echo "✅ All health checks passed!"

      - name: "Verify: API access points"
        run: |
          echo "Verifying all API access points per DEPLOYMENT.md..."

          # Test API Documentation endpoint
          echo "Testing /docs endpoint..."
          curl -f http://localhost:8001/docs &>/dev/null || echo "⚠️ /docs endpoint not accessible (may require browser)"

          # Test Metrics endpoint (Prometheus format)
          echo "Testing /api/v1/metrics endpoint..."
          curl -f http://localhost:8001/api/v1/metrics || echo "⚠️ /api/v1/metrics not available"

          # Test API version endpoint
          echo "Testing /api/v1/version endpoint..."
          curl -f http://localhost:8001/api/v1/version || echo "⚠️ /api/v1/version not available"

          echo "✅ Access point verification completed!"

      - name: "Post-deploy: Run MAIW pytest (pytest -m maiw)"
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -e
          echo "Waiting for MAIW frontend on http://127.0.0.1:3001 (required for Playwright UI tests)..."
          max_retries=30
          retry_count=0
          until curl -f -s -o /dev/null http://127.0.0.1:3001/ || [ $retry_count -eq $max_retries ]; do
            echo "Attempt $((retry_count + 1))/$max_retries: frontend not ready..."
            sleep 2
            retry_count=$((retry_count + 1))
          done
          if [ $retry_count -eq $max_retries ]; then
            echo "❌ MAIW frontend not reachable on port 3001"
            exit 1
          fi
          echo "✅ MAIW frontend is ready"

          echo "Authenticating to nvcr.io for blueprint-github-test image pull..."
          if [ -z "${TEST_DOCKER_PULL_KEY}" ]; then
            echo "❌ Missing required secret: TEST_DOCKER_PULL_KEY"
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin

          echo "Pulling blueprint-github-test image for pytest..."
          TEST_IMAGE="nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest"
          docker pull "${TEST_IMAGE}"

          mkdir -p "${GITHUB_WORKSPACE}/reports"
          echo "Running: pytest -m maiw --maiw-playground-url=http://127.0.0.1:3001"
          set +e
          docker run --net=host --rm \
            -v "${GITHUB_WORKSPACE}/reports:/reports" \
            "${TEST_IMAGE}" \
            pytest -m maiw --maiw-playground-url=http://127.0.0.1:3001 --disable-warnings --self-contained-html --html=/reports/maiw_test_report.html
          PYTEST_EXIT=$?
          set -e

          echo "Docker logs (wosa-frontend):"
          docker logs wosa-frontend 2>&1 || true
          echo "Docker logs (wosa-backend):"
          docker logs wosa-backend 2>&1 || true

          if [ "$PYTEST_EXIT" -eq 0 ]; then
            echo "✅ MAIW pytest completed"
          else
            echo "❌ MAIW pytest failed (exit code: ${PYTEST_EXIT})"
          fi
          exit "$PYTEST_EXIT"

      - name: Upload MAIW pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maiw-pytest-report
          path: reports/maiw_test_report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload production checklist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-checklist
          path: production-checklist.md
          retention-days: 90
  
      - name: Set result output
        id: set_result
        if: always()  
        run: |
          echo "RESULT=$(if [ ${{ job.status }} == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> $GITHUB_OUTPUT
   
      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          
          # Email details
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>
            
            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>
            
            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
            
            <p>Thanks!</p>      

