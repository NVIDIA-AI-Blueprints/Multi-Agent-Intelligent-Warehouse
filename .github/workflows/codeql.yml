name: "CodeQL Security Analysis"

# Security code scanning (security-and-quality queries) uploaded to GitHub
# code scanning. The push, pull_request and weekly triggers were removed in
# #71 (2026-08-20), so main had no CodeQL security analysis after 2026-08-17;
# see docs/security/sonarqube-root-cause-analysis.md. The "Analyze (...)"
# checks from GitHub Code Quality are a separate product and do not upload
# security alerts.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # weekly, Monday 02:00 UTC: new queries on unchanged code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
