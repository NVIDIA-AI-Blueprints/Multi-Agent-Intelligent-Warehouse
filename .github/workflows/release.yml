name: Release preview

# Releases are cut by a maintainer, never by CI. This workflow only
# previews what semantic-release would compute (next version and
# generated notes) from the conventional commits since the last tag.
# It always runs with --dry-run: it creates no tag, no GitHub release
# and no commit. See docs/operations/RELEASING.md for the procedure.

on:
  workflow_dispatch:

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Release preview (dry run)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # semantic-release checks push access even in dry-run mode; nothing
    # is pushed because --dry-run skips the prepare and publish steps.
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # semantic-release requires Node ^22.14.0 (see semantic-release docs/support/node-version.md)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci
      env:
        HUSKY: '0'

    - name: Preview release (dry run)
      run: >-
        npx semantic-release --dry-run --no-ci
        --repository-url "${{ github.server_url }}/${{ github.repository }}.git"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
