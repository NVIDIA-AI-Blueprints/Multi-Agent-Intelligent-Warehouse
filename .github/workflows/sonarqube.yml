name: SonarQube Analysis

# NVIDIA SonarQube (sonar.nvidia.com) analysis for nSpect NSPECT-NJMX-9GQU
# (component MAIW-Core). Root cause of the earlier gap and the design:
# docs/security/sonarqube-root-cause-analysis.md.
#
# - Runs after the CI/CD Pipeline succeeds for a push to main or a pull
#   request from a branch of this repository, and analyzes that exact commit
#   with the coverage.xml that run produced (no second test run).
# - Never runs for pull requests from forks: workflow_run executes with this
#   repository's secrets and may be on an NVIDIA-network runner.
# - The scan script and sonar-project.properties come from the commit this
#   workflow runs from (github.sha: the default branch for workflow_run), in
#   sonar-tools/. The analyzed commit is checked out separately in source/
#   and is only data: a pull request branch never runs code in the step that
#   holds SONAR_TOKEN, and branches cut before the script existed still scan.
# - sonar.nvidia.com resolves to a private address. Set the repository
#   variable MAIW_SONAR_RUNNER to the label of an approved NVIDIA-network
#   runner; on a GitHub-hosted runner the job fails at the reachability check
#   instead of passing without a scan.
# - The job fails when the analysis cannot run or the quality gate is ERROR.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI/CD Pipeline run whose coverage.xml to use (default: latest successful run for the selected commit)"
        required: false
      release_version:
        description: "projectVersion for a release candidate, e.g. 2.1.2 (empty: tag or development version)"
        required: false

permissions: {}

concurrency:
  group: sonarqube-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    if: >-
      github.repository == 'NVIDIA-AI-Blueprints/Multi-Agent-Intelligent-Warehouse' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
         github.event.workflow_run.event == 'pull_request')))
    runs-on: ${{ vars.MAIW_SONAR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read  # download coverage.xml from the CI/CD Pipeline run
    steps:
    - name: Resolve commit and CI run
      id: target
      uses: actions/github-script@v9
      env:
        CI_RUN_ID: ${{ inputs.ci_run_id }}
      with:
        script: |
          const ev = context.payload;
          let sha, runId, prKey = '', prBranch = '', prBase = '', branch = '';
          if (context.eventName === 'workflow_run') {
            const run = ev.workflow_run;
            sha = run.head_sha;
            runId = run.id;
            if (run.event === 'pull_request') {
              const pr = (run.pull_requests || [])[0];
              if (!pr) core.setFailed('workflow_run for a pull request carries no pull request');
              else { prKey = String(pr.number); prBranch = pr.head.ref; prBase = pr.base.ref; }
            } else {
              branch = run.head_branch;
            }
          } else {
            sha = context.sha;
            branch = context.ref.replace('refs/heads/', '');
            runId = process.env.CI_RUN_ID || '';
            if (runId && !/^[0-9]+$/.test(runId)) {
              core.setFailed(`ci_run_id must be a number, got "${runId}"`);
              return;
            }
            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ci-cd.yml', head_sha: sha, status: 'success', per_page: 1,
              });
              if (!runs.data.workflow_runs.length) {
                core.setFailed(`No successful CI/CD Pipeline run for ${sha}; run CI first or pass ci_run_id`);
              } else {
                runId = runs.data.workflow_runs[0].id;
              }
            }
          }
          core.setOutput('sha', sha);
          core.setOutput('ci_run_id', String(runId || ''));
          core.setOutput('branch', branch);
          core.setOutput('pr_key', prKey);
          core.setOutput('pr_branch', prBranch);
          core.setOutput('pr_base', prBase);
          core.info(`sha=${sha} ci_run_id=${runId} branch=${branch} pr=${prKey}`);

    - name: Checkout trusted scan tooling
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: sonar-tools
        sparse-checkout: |
          scripts/security/run_sonar_scan.sh
          scripts/security/release_version.sh
          sonar-project.properties
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout analyzed commit
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.target.outputs.sha }}
        path: source
        fetch-depth: 0  # blame and tags (projectVersion) for the analysis
        persist-credentials: false

    - name: Download coverage from the CI/CD Pipeline run
      uses: actions/download-artifact@v8
      with:
        name: sonar-coverage
        path: source
        run-id: ${{ steps.target.outputs.ci_run_id }}
        github-token: ${{ github.token }}

    - name: Run SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonar.nvidia.com' }}
        MAIW_SONAR_BRANCH: ${{ steps.target.outputs.branch }}
        MAIW_SONAR_PR_KEY: ${{ steps.target.outputs.pr_key }}
        MAIW_SONAR_PR_BRANCH: ${{ steps.target.outputs.pr_branch }}
        MAIW_SONAR_PR_BASE: ${{ steps.target.outputs.pr_base }}
        MAIW_SONAR_SOURCE_DIR: source
        MAIW_SONAR_SETTINGS: sonar-tools/sonar-project.properties
        MAIW_SONAR_EVIDENCE: ${{ github.workspace }}/sonar-evidence/maiw-sonar-evidence.json
        MAIW_RELEASE_VERSION: ${{ inputs.release_version }}
      run: sonar-tools/scripts/security/run_sonar_scan.sh

    - name: Summary
      if: always()
      run: |
        f=sonar-evidence/maiw-sonar-evidence.json
        {
          echo "### SonarQube analysis"
          echo "- Commit: \`${{ steps.target.outputs.sha }}\`"
          echo "- Scan tooling: \`${{ github.sha }}\`"
          if [ -f "$f" ]; then
            python3 -c "import json;e=json.load(open('$f'));[print(f'- {k}: {e.get(k)}') for k in ('analysis_id','executed_at','branch','pull_request','quality_gate_status','dashboard_url')]"
          else
            echo "- **No analysis was submitted.** See the job log."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload analysis evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sonarqube-evidence
        path: sonar-evidence/
        if-no-files-found: ignore
        retention-days: 90
