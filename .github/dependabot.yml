version: 2
updates:
  # Python dependencies - Core backend
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Limits open version-update PRs only; security updates are not counted.
    open-pull-requests-limit: 5
    reviewers:
      - "T-DevH"
    assignees:
      - "T-DevH"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "backend"
    # Routine minor and patch updates arrive as one PR. Major updates and the
    # warehouse-integration libraries (MQTT, Modbus, BACnet, serial,
    # websockets) still get their own PRs: their APIs change between
    # releases, and CI does not exercise those adapters against real devices.
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "paho-mqtt"
          - "pymodbus"
          - "bacpypes3"
          - "pyserial"
          - "websockets"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates for critical packages
    ignore:
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain"
        update-types: ["version-update:semver-major"]

  # Node.js dependencies - Frontend UI
  - package-ecosystem: "npm"
    directory: "/src/ui/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 15
    reviewers:
      - "T-DevH"
    assignees:
      - "T-DevH"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    # All minor and patch updates arrive as one PR
    groups:
      ui-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # No version-update PRs for major versions: UI majors are upgraded
    # deliberately. Security updates are not affected by update-types ignores.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker dependencies - Container images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 8
    reviewers:
      - "T-DevH"
    assignees:
      - "T-DevH"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"

  # GitHub Actions - CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 8
    reviewers:
      - "T-DevH"
    assignees:
      - "T-DevH"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    # Allowed only at one pinned commit by the repository's allowed-actions
    # policy; any other version fails the deployment workflow at startup.
    ignore:
      - dependency-name: "dawidd6/action-send-mail"
